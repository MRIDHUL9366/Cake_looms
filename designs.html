function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

document.getElementById("imgs").textContent = Object.keys(IMG).map(function(k) {
  return '.i-' + k + '{background-image:url(' + IMG[k] + ')}';
}).join("");

var one = D.map(function(c, i) {
  return '<a href="#c' + i + '">' + esc(c.n) + '</a>';
}).join("");

var nv = document.getElementById("nav"), setW = 0, pos = 0, dir = 1, paused = false, timer = 0, drag = false, mv = false;
function measure() { setW = nv.scrollWidth / 5; }
function wrap() {
  var s = nv.scrollLeft;
  if (s >= 3 * setW) { nv.scrollLeft = s - setW; return true; }
  if (s < setW) { nv.scrollLeft = s + setW; return true; }
  return false;
}
function hold() { paused = true; clearTimeout(timer); }
function rest() {
  clearTimeout(timer);
  timer = setTimeout(function() { pos = nv.scrollLeft; paused = false; }, 2500);
}
measure();
nv.scrollLeft = 2 * setW;
pos = 2 * setW;

window.addEventListener("resize", function() { measure(); });
["touchstart", "mouseenter", "wheel"].forEach(function(e) { nv.addEventListener(e, hold, {passive: true}); });
["touchend", "touchcancel", "mouseleave"].forEach(function(e) { nv.addEventListener(e, rest, {passive: true}); });
nv.addEventListener("scroll", function() { if (paused) { wrap(); pos = nv.scrollLeft; rest(); } }, {passive: true});

/* mouse drag */
var dx0 = 0, s0 = 0;
nv.addEventListener("pointerdown", function(e) {
  if (e.pointerType !== "mouse") return;
  drag = true; mv = false; dx0 = e.clientX; s0 = nv.scrollLeft; hold();
});
window.addEventListener("pointermove", function(e) {
  if (!drag) return;
  var d = e.clientX - dx0;
  if (Math.abs(d) > 4) mv = true;
  nv.scrollLeft = s0 - d;
  if (wrap()) { s0 = nv.scrollLeft + d; }
});
window.addEventListener("pointerup", function() { if (drag) { drag = false; rest(); } });
nv.addEventListener("click", function(e) { if (mv) { e.preventDefault(); e.stopPropagation(); mv = false; } }, true);

/* slow automatic loop when not interacting */
var calm = window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
if (!calm) {
  var last = performance.now();
  (function tick(now) {
    var dt = Math.min(now - last, 50);
    last = now;
    if (!paused && setW) {
      pos += dir * dt * 0.025;
      if (pos >= 3 * setW) pos -= setW;
      nv.scrollLeft = pos;
    }
    requestAnimationFrame(tick);
  })(last);
}

function show(i, scroll) {
  cur = i;

  var listHtml = c.i.map(function(x, k) {
    var priceText = x.p && x.p !== "Ask" ? ("\u20b9" + x.p) : "Ask";

    var waUrl = "https://wa.me/919037141594?text=" + encodeURIComponent(waMsg);
    return '<a class="it" href="' + waUrl + '" target="_blank" rel="noopener" style="--d:' + Math.min(k, 14) + '" title="Click to order ' + esc(x.n) + ' on WhatsApp">' +
      '<b>' + esc(x.n) + '</b>' +
      '<i>' + priceText + '</i>' +
      '<span class="order-chip">Order &rarr;</span>' +
    '</a>';
  }).join("");

  document.getElementById("m").innerHTML = '<section>' +

    '</div>' +
    '<div class="list">' + listHtml + '</div>' +
    '<button class="next" type="button" id="nx">Next: ' + esc(D[nextIdx].n) + ' &rarr;</button>' +
    INFO +
  '</section>';

  [].forEach.call(nv.children, function(a) {
    a.classList.toggle("on", a.getAttribute("href") === "#c" + i);

  document.getElementById("now").innerHTML = 'Now viewing: <b>' + esc(c.n) + '</b>';

  var ch = nv.children[2 * D.length + i];
  if (ch) {
    hold();
    nv.scrollTo({ left: ch.offsetLeft - (nv.clientWidth - ch.offsetWidth) / 2, behavior: "smooth" });
    rest();
  }

  document.getElementById("nx").onclick = function() {
    show(nextIdx, true);
  };

  if (scroll) {
    var top = document.getElementById("m").offsetTop - document.querySelector(".navw").offsetHeight;
    if (window.scrollY > top) window.scrollTo({ top: top, behavior: "smooth" });
  }
}

function getIndexFromHash() {
  var h = (window.location.hash || "").replace("#", "").toLowerCase();
  if (!h) return 0;
  if (/^c\d+$/.test(h)) {
    var idx = parseInt(h.slice(1), 10);
    return (idx >= 0 && idx < D.length) ? idx : 0;
  }
  var slugMap = {
    "fresh-selection": 0,
    "fresh-cream": 1,
    "classic-cakes": 2,
    "classic": 2,
    "berry-fruit": 3,

    "kids": 7,
    "wedding": 2,
    "premium-cakes": 8,
    "premium": 8,
    "birthday": 8
  };
  return slugMap.hasOwnProperty(h) ? slugMap[h] : 0;
}

});
